name: Public release

on:
  push:
    tags:
      - "v*"

jobs:
  build_verify:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    env:
      TRIAGEPILOT_UPGRADE_PREVIOUS_RELEASE_COMMIT: 9d58fcffb04b381293c4730f947f7d7a4fad4782
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: triagepilot
          POSTGRES_PASSWORD: triagepilot
          POSTGRES_DB: triagepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triagepilot -d triagepilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      git_commit: ${{ steps.release_meta.outputs.git_commit }}
      artifact_published_at: ${{ steps.release_meta.outputs.artifact_published_at }}
      artifact_future_license_effective_at: ${{ steps.release_meta.outputs.artifact_future_license_effective_at }}
      container_digest: ${{ steps.container_meta.outputs.container_digest }}
      image_name: ${{ steps.release_meta.outputs.image_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.1.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - id: release_meta
        name: Validate annotated tag and synchronized version
        run: |
          set -Eeuo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an exact annotated vX.Y.Z tag, got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          ref_object_type="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(objecttype)')"
          if [[ "$ref_object_type" != "tag" ]]; then
            echo "Release tags must be annotated; ${GITHUB_REF_NAME} is ${ref_object_type:-missing}." >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          package_version="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const manifest = JSON.parse(readFileSync('package.json', 'utf8')); process.stdout.write(manifest.version);")"
          dockerfile_version="$(sed -n 's/^ARG TRIAGEPILOT_VERSION=//p' Dockerfile)"
          if [[ "$package_version" != "$version" ]]; then
            echo "package.json version ${package_version} does not match tag ${version}." >&2
            exit 1
          fi
          if [[ "$dockerfile_version" != "$version" ]]; then
            echo "Dockerfile version ${dockerfile_version} does not match tag ${version}." >&2
            exit 1
          fi

          image_repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tagger_epoch="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(taggerdate:unix)')"
          if [[ ! "$tagger_epoch" =~ ^[1-9][0-9]*$ ]]; then
            echo "Annotated tag ${GITHUB_REF_NAME} does not contain a valid tagger timestamp." >&2
            exit 1
          fi
          artifact_published_at="$(TAGGER_EPOCH="$tagger_epoch" node --input-type=module -e "process.stdout.write(new Date(Number(process.env.TAGGER_EPOCH) * 1000).toISOString());")"
          artifact_future_license_effective_at="$(ARTIFACT_PUBLISHED_AT="$artifact_published_at" node --input-type=module -e "const date = new Date(process.env.ARTIFACT_PUBLISHED_AT); date.setUTCFullYear(date.getUTCFullYear() + 2); process.stdout.write(date.toISOString());")"
          echo "SOURCE_DATE_EPOCH=$tagger_epoch" >> "$GITHUB_ENV"
          {
            echo "version=$version"
            echo "git_commit=$(git rev-parse HEAD)"
            echo "artifact_published_at=$artifact_published_at"
            echo "artifact_future_license_effective_at=$artifact_future_license_effective_at"
            echo "image_name=ghcr.io/${image_repository}:$version"
          } >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://triagepilot:triagepilot@localhost:5432/triagepilot
      - run: pnpm build
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://triagepilot:triagepilot@localhost:5432/triagepilot
      - name: Assert previous-release baseline is available
        run: git cat-file -e "${TRIAGEPILOT_UPGRADE_PREVIOUS_RELEASE_COMMIT}^{commit}"
      - run: pnpm check:package-boundary
      - run: pnpm check:public-boundary
      - run: docker compose config

      - name: Build local release test image
        run: |
          set -Eeuo pipefail
          docker build \
            --build-arg "TRIAGEPILOT_VERSION=${{ steps.release_meta.outputs.version }}" \
            --build-arg "TRIAGEPILOT_GIT_COMMIT=${{ steps.release_meta.outputs.git_commit }}" \
            --build-arg "TRIAGEPILOT_PUBLISHED_AT=${{ steps.release_meta.outputs.artifact_published_at }}" \
            --build-arg "TRIAGEPILOT_FUTURE_LICENSE_EFFECTIVE_AT=${{ steps.release_meta.outputs.artifact_future_license_effective_at }}" \
            --tag "triagepilot-release:${{ steps.release_meta.outputs.version }}" \
            .

      - name: Build publishable OCI image archive
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/container
          docker buildx build \
            --metadata-file "$RUNNER_TEMP/buildx-metadata.json" \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --output "type=oci,dest=artifacts/container/triagepilot-${{ steps.release_meta.outputs.version }}.oci.tar,name=${{ steps.release_meta.outputs.image_name }},rewrite-timestamp=true" \
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
            --build-arg "TRIAGEPILOT_VERSION=${{ steps.release_meta.outputs.version }}" \
            --build-arg "TRIAGEPILOT_GIT_COMMIT=${{ steps.release_meta.outputs.git_commit }}" \
            --build-arg "TRIAGEPILOT_PUBLISHED_AT=${{ steps.release_meta.outputs.artifact_published_at }}" \
            --build-arg "TRIAGEPILOT_FUTURE_LICENSE_EFFECTIVE_AT=${{ steps.release_meta.outputs.artifact_future_license_effective_at }}" \
            --annotation "index,manifest:org.opencontainers.image.version=${{ steps.release_meta.outputs.version }}" \
            --annotation "index,manifest:org.opencontainers.image.licenses=FSL-1.1-Apache-2.0" \
            --annotation "index,manifest:org.opencontainers.image.revision=${{ steps.release_meta.outputs.git_commit }}" \
            --annotation "index,manifest:org.opencontainers.image.created=${{ steps.release_meta.outputs.artifact_published_at }}" \
            --annotation "index,manifest:org.triagepilot.future-license-effective-at=${{ steps.release_meta.outputs.artifact_future_license_effective_at }}" \
            --tag "triagepilot-release:${{ steps.release_meta.outputs.version }}" \
            .
          node scripts/create-release-image-metadata.mjs \
            --input "$RUNNER_TEMP/buildx-metadata.json" \
            --oci-archive "artifacts/container/triagepilot-${{ steps.release_meta.outputs.version }}.oci.tar" \
            --output artifacts/container/metadata.json

      - id: container_meta
        name: Capture release image digest
        run: |
          set -Eeuo pipefail
          digest="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const metadata = JSON.parse(readFileSync('artifacts/container/metadata.json', 'utf8')); const digest = metadata['containerimage.digest'] ?? metadata['containerimage.descriptor']?.digest; if (!digest) throw new Error('Buildx metadata did not contain a container digest.'); process.stdout.write(digest);")"
          echo "container_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify previous-release database upgrade
        run: bash scripts/test-previous-release-upgrade.sh
        env:
          TRIAGEPILOT_UPGRADE_CURRENT_IMAGE: triagepilot-release:${{ steps.release_meta.outputs.version }}

      - run: pnpm smoke:compose

      - name: Scan tracked history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: git --no-banner --redact .

      - name: Pack public packages
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/packages
          for package_dir in \
            packages/contracts \
            packages/config \
            packages/core \
            packages/application \
            packages/db \
            packages/provider-github \
            packages/ui
          do
            TRIAGEPILOT_ARTIFACT_PUBLISHED_AT="${{ steps.release_meta.outputs.artifact_published_at }}" \
            TRIAGEPILOT_ARTIFACT_FUTURE_LICENSE_EFFECTIVE_AT="${{ steps.release_meta.outputs.artifact_future_license_effective_at }}" \
              pnpm --dir "$package_dir" pack --pack-destination "$GITHUB_WORKSPACE/artifacts/packages"
          done

      - name: Verify packed packages in a temporary consumer
        run: |
          set -Eeuo pipefail
          consumer_dir="$(mktemp -d "$RUNNER_TEMP/triagepilot-release-consumer.XXXXXX")"
          pushd "$consumer_dir" >/dev/null
          npm init -y >/dev/null
          npm install --ignore-scripts --no-package-lock \
            "$GITHUB_WORKSPACE"/artifacts/packages/*.tgz \
            react@18.3.1 \
            react-dom@18.3.1
          node --input-type=module <<'NODE'
          import { ensureLocalWorkspace } from "@triagepilot/db";
          import { resolveConfiguration } from "@triagepilot/config";
          import { buildRoutingKey } from "@triagepilot/contracts";
          import { scorePullRequestRisk } from "@triagepilot/core";
          import { processChangeRequest } from "@triagepilot/application";
          import { normalizeGitHubWebhook } from "@triagepilot/provider-github";
          import * as ui from "@triagepilot/ui";

          if (typeof ensureLocalWorkspace !== "function") throw new Error("@triagepilot/db import failed");
          if (typeof resolveConfiguration !== "function") throw new Error("@triagepilot/config import failed");
          if (typeof buildRoutingKey !== "function") throw new Error("@triagepilot/contracts import failed");
          if (typeof scorePullRequestRisk !== "function") throw new Error("@triagepilot/core import failed");
          if (typeof processChangeRequest !== "function") throw new Error("@triagepilot/application import failed");
          if (typeof normalizeGitHubWebhook !== "function") throw new Error("@triagepilot/provider-github import failed");
          if (!("OperationsDashboard" in ui)) throw new Error("@triagepilot/ui import failed");
          NODE
          test -f node_modules/@triagepilot/ui/dist/styles.css
          popd >/dev/null

      - name: Generate release manifest and checksums
        run: |
          set -Eeuo pipefail
          snapshot_dir="$(mktemp -d "$RUNNER_TEMP/triagepilot-release-worktree.XXXXXX")"
          git worktree add --detach "$snapshot_dir" "$GITHUB_SHA"
          mapfile -t package_tarballs < <(find "$GITHUB_WORKSPACE/artifacts/packages" -maxdepth 1 -name '*.tgz' -print | sort)
          manifest_args=()
          for tarball in "${package_tarballs[@]}"; do
            manifest_args+=(--package-tarball "$tarball")
          done
          node scripts/create-release-manifest.mjs \
            --cwd "$snapshot_dir" \
            --version "${{ steps.release_meta.outputs.version }}" \
            --git-commit "${{ steps.release_meta.outputs.git_commit }}" \
            --database-migration 0010_provider_connection_preemptive_revocations.sql \
            --container-digest "${{ steps.container_meta.outputs.container_digest }}" \
            --published-at "${{ steps.release_meta.outputs.artifact_published_at }}" \
            --oci-metadata "$GITHUB_WORKSPACE/artifacts/container/metadata.json" \
            "${manifest_args[@]}"
          cp "$snapshot_dir/artifacts/release-manifest.json" "$GITHUB_WORKSPACE/artifacts/release-manifest.json"
          node scripts/create-release-notes.mjs \
            --manifest "$GITHUB_WORKSPACE/artifacts/release-manifest.json" \
            --output "$GITHUB_WORKSPACE/artifacts/release-notes.md"
          git worktree remove "$snapshot_dir" --force
          (
            cd "$GITHUB_WORKSPACE/artifacts"
            sha256sum \
              container/metadata.json \
              "container/triagepilot-${{ steps.release_meta.outputs.version }}.oci.tar" \
              release-manifest.json \
              release-notes.md \
              $(find packages -maxdepth 1 -type f -name '*.tgz' -print | sort) \
              > checksums.txt
          )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-release-artifacts
          path: artifacts
          if-no-files-found: error

  publish:
    name: Publish verified artifacts
    runs-on: ubuntu-latest
    needs: build_verify
    environment: public-release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.1.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm CLI with trusted publishing support
        run: npm install --global npm@11.5.1

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-release-artifacts
          path: artifacts

      - name: Publish verified artifacts idempotently
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -Eeuo pipefail
          oras version
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          node scripts/publish-release-artifacts.mjs \
            --artifacts-dir artifacts \
            --version "${{ needs.build_verify.outputs.version }}" \
            --tag-name "$GITHUB_REF_NAME" \
            --image-name "${{ needs.build_verify.outputs.image_name }}" \
            --git-commit "${{ needs.build_verify.outputs.git_commit }}" \
            --database-migration 0010_provider_connection_preemptive_revocations.sql \
            --container-digest "${{ needs.build_verify.outputs.container_digest }}"

      - name: Attest the published release bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/**/*
