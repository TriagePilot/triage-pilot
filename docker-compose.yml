services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: triagepilot
      POSTGRES_PASSWORD: triagepilot
      POSTGRES_DB: triagepilot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${TRIAGEPILOT_POSTGRES_BIND:-127.0.0.1}:${TRIAGEPILOT_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triagepilot -d triagepilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: pnpm --filter @triagepilot/web start
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8787}
      DATABASE_URL: ${DATABASE_URL:-postgres://triagepilot:triagepilot@postgres:5432/triagepilot}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-replace-with-admin-username}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_FILE: ${ADMIN_PASSWORD_FILE:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_SECRET_FILE: ${SESSION_SECRET_FILE:-}
      GITHUB_ORGANIZATION: ${GITHUB_ORGANIZATION:-replace-with-github-organization}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-replace-with-github-app-id}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_PRIVATE_KEY_FILE: ${GITHUB_PRIVATE_KEY_FILE:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_WEBHOOK_SECRET_FILE: ${GITHUB_WEBHOOK_SECRET_FILE:-}
    ports:
      - "${TRIAGEPILOT_WEB_BIND:-0.0.0.0}:${TRIAGEPILOT_WEB_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: pnpm --filter @triagepilot/worker start
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgres://triagepilot:triagepilot@postgres:5432/triagepilot}
      GITHUB_ORGANIZATION: ${GITHUB_ORGANIZATION:-replace-with-github-organization}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-replace-with-github-app-id}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_PRIVATE_KEY_FILE: ${GITHUB_PRIVATE_KEY_FILE:-}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-2000}
      WORKER_ID: ${WORKER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
